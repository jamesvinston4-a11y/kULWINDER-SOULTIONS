<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <!-- ✅ Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin: 0; font-family: Arial; }

        #loginPage {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .login-box input {
            display: block;
            width: 220px;
            margin: 10px auto;
            padding: 10px;
        }

        #mainSite { display: none; }

        .navbar {
            background: #222;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            margin: 0 15px;
            cursor: pointer;
            font-size: 18px;
        }

        .navbar a:hover { color: yellow; }

        .section { display: none; }
        .active { display: block; }

        .banner {
            width: 100%;
            height: 400px;
            background: url('https://picsum.photos/1200/500') no-repeat center;
            background-size: cover;
        }

        .form-box {
            width: 400px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 10px #ccc;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            cursor: pointer;
        }

        .submit-btn { background: green; color: white; }
        .clear-btn { background: red; color: white; }

        table { border-collapse: collapse; }
        table th, table td { padding: 8px; text-align: center; }
    </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="error" style="color:red;"></p>
    </div>
</div>

<!-- MAIN -->
<div id="mainSite">

    <div class="navbar">
        <a onclick="showSection('home')">Home</a>
        <a onclick="showSection('contact')">Contact</a>
        <a id="adminMenu" onclick="showSection('createUser')" style="display:none;">Create User</a>
        <a id="viewUsersMenu" onclick="showSection('viewUsers')" style="display:none;">View Users</a>
        <a id="dashboardMenu" onclick="showSection('dashboard')" style="display:none;">Dashboard</a>
    </div>

    <!-- HOME -->
    <div id="home" class="section active">
        <div class="banner"></div>
    </div>

    <!-- CONTACT -->
    <div id="contact" class="section">
        <div class="form-box">
            <h2>Contact Form</h2>
            <form id="contactForm">
                <input type="text" name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="text" name="phone" placeholder="Phone">

                <select name="option">
                    <option>General Inquiry</option>
                    <option>Support</option>
                    <option>Feedback</option>
                </select>

                <textarea name="message" placeholder="Message"></textarea>

                <button type="submit" class="submit-btn">Submit</button>
                <button type="button" class="clear-btn" onclick="clearForm()">Clear</button>
            </form>
        </div>
    </div>

    <!-- CREATE USER -->
    <div id="createUser" class="section">
        <div class="form-box">
            <h2>Create User</h2>
            <input type="text" id="newUser" placeholder="Username">
            <input type="password" id="newPass" placeholder="Password">
            <button onclick="createUser()">Create User</button>
        </div>
    </div>

    <!-- VIEW USERS -->
    <div id="viewUsers" class="section">
        <div class="form-box">
            <h2>User List</h2>
            <button onclick="loadUsers()">Refresh</button>
            <table border="1" width="100%" id="userTable">
                <tr><th>Username</th><th>Password</th></tr>
            </table>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="section">
        <div class="form-box">
            <h2>Dashboard</h2>
            <button onclick="loadChart()">Load Chart</button>
            <canvas id="myChart"></canvas>
        </div>
    </div>

</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwWvy4lhUBgNNt8wsxn5lQQ4rOOd_v6mJgArFBrTf_82k5qGDaK-s9AdH42TwTXjdG2EQ/exec";

/* SWITCH */
function showSection(id) {
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* LOGIN */
function login() {
    fetch(URL, {
        method: "POST",
        body: JSON.stringify({
            type: "login",
            username: username.value.trim(),
            password: password.value.trim()
        })
    })
    .then(res => res.text())
    .then(res => {
        if (res === "ADMIN") {
            openSite(true);
        } else if (res === "USER") {
            openSite(false);
        } else {
            error.innerText = "Wrong Username or Password";
        }
    });
}

function openSite(isAdmin) {
    loginPage.style.display = "none";
    mainSite.style.display = "block";

    if (isAdmin) {
        adminMenu.style.display = "inline";
        viewUsersMenu.style.display = "inline";
        dashboardMenu.style.display = "inline";
    }
}

/* CREATE USER */
function createUser() {
    fetch(URL, {
        method: "POST",
        body: JSON.stringify({
            type: "createUser",
            username: newUser.value,
            password: newPass.value
        })
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        newUser.value = "";
        newPass.value = "";
    });
}

/* LOAD USERS */
function loadUsers() {
    fetch(URL, {
        method: "POST",
        body: JSON.stringify({ type: "getUsers" })
    })
    .then(res => res.json())
    .then(data => {
        let table = userTable;
        table.innerHTML = "<tr><th>Username</th><th>Password</th></tr>";

        data.forEach((r,i)=>{
            if(i===0) return;
            let row = table.insertRow();
            row.insertCell(0).innerText = r[0];
            row.insertCell(1).innerText = r[1];
        });
    });
}

/* CHART */
let chart;
function loadChart() {
    fetch(URL, {
        method: "POST",
        body: JSON.stringify({ type: "getFormData" })
    })
    .then(res => res.json())
    .then(data => {

        let count = {};

        for (let i = 1; i < data.length; i++) {
            let type = data[i][4];
            if (!type) continue;
            count[type] = (count[type] || 0) + 1;
        }

        if (chart) chart.destroy();

        chart = new Chart(myChart, {
            type: 'bar',
            data: {
                labels: Object.keys(count),
                datasets: [{
                    label: "Form Entries",
                    data: Object.values(count)
                }]
            }
        });
    });
}

/* FORM */
contactForm.addEventListener("submit", function(e){
    e.preventDefault();

    fetch(URL,{
        method:"POST",
        body:JSON.stringify({
            type:"form",
            name:this.name.value,
            email:this.email.value,
            phone:this.phone.value,
            option:this.option.value,
            message:this.message.value
        })
    })
    .then(()=>{ alert("Submitted"); this.reset(); });
});

function clearForm(){
    contactForm.reset();
}
</script>

</body>
</html>
